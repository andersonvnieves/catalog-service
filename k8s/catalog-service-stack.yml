apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-api-secrets
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: catalog-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: sql-password
      remoteRef:
        key: /fgc/catalog/sql-password
    - secretKey: connection-string
      remoteRef:
        key: /fgc/catalog/connection-string
    - secretKey: jwt-key
      remoteRef:
        key: /fgc/jwt/secret
    - secretKey: rabbitmq-uri
      remoteRef:
        key: /fgc/catalog/rabbitmq-uri
    - secretKey: mongo-user
      remoteRef:
        key: /fgc/catalog/mongo-user
    - secretKey: mongo-password
      remoteRef:
        key: /fgc/catalog/mongo-password
    - secretKey: mongodb-uri
      remoteRef:
        key: /fgc/catalog/mongodb-uri
    - secretKey: mongodb-dbname
      remoteRef:
        key: /fgc/catalog/mongodb-dbname
    - secretKey: redis-connection
      remoteRef:
        key: /fgc/catalog/redis-connection
    - secretKey: redis-password
      remoteRef:
        key: /fgc/catalog/redis-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-api-config
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: catalog-api-config
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        jwt-issuer: "{{ .jwt_issuer }}"
        jwt-audience: "{{ .jwt_audience }}"
        jwt-token-ttl: "{{ .jwt_token_ttl }}"
        order-created-exchange: "{{ .order_created_exchange }}"
        order-created-routing-key: "{{ .order_created_routing_key }}"
        order-created-queue-name: "{{ .order_created_queue_name }}"
        payment-processed-exchange: "{{ .payment_processed_exchange }}"
        payment-processed-routing-key: "{{ .payment_processed_routing_key }}"
        payment-processed-queue-name: "{{ .payment_processed_queue_name }}"
  data:
    - secretKey: jwt_issuer
      remoteRef:
        key: /fgc/jwt/issuer
    - secretKey: jwt_audience
      remoteRef:
        key: /fgc/jwt/audience
    - secretKey: jwt_token_ttl
      remoteRef:
        key: /fgc/jwt/token-ttl
    - secretKey: order_created_exchange
      remoteRef:
        key: /fgc/catalog/order-created-exchange
    - secretKey: order_created_routing_key
      remoteRef:
        key: /fgc/catalog/order-created-routing-key
    - secretKey: order_created_queue_name
      remoteRef:
        key: /fgc/catalog/order-created-queue-name
    - secretKey: payment_processed_exchange
      remoteRef:
        key: /fgc/catalog/payment-processed-exchange
    - secretKey: payment_processed_routing_key
      remoteRef:
        key: /fgc/catalog/payment-processed-routing-key
    - secretKey: payment_processed_queue_name
      remoteRef:
        key: /fgc/catalog/payment-processed-queue-name
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: catalog-db-pvc, namespace: fgc }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-db, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog-db } }
  template:
    metadata: { labels: { app: catalog-db } }
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [{ containerPort: 1433 }]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: sql-password } }
          volumeMounts: [{ name: sql-data, mountPath: /var/opt/mssql }]
      volumes: [{ name: sql-data, persistentVolumeClaim: { claimName: catalog-db-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: catalog-db-service, namespace: fgc }
spec:
  selector: { app: catalog-db }
  ports: [{ port: 1433, targetPort: 1433 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: catalog-mongo-pvc, namespace: fgc}
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-mongodb, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: mongo-user } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: mongo-password } }
          volumeMounts: [{ name: mongo-data, mountPath: /data/db }]
      volumes: [{ name: mongo-data, persistentVolumeClaim: { claimName: catalog-mongo-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: mongodb-service, namespace: fgc }
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: admin }
            - { name: RABBITMQ_DEFAULT_PASS, value: admin123 }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq-service, namespace: fgc }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports: [{ containerPort: 6379 }]
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: redis-password } }
---
apiVersion: v1
kind: Service
metadata: { name: redis-service, namespace: fgc }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: fgc
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"    
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando o SQL Server (1433)..."
              until nc -z -w 2 catalog-db-service 1433; do
                sleep 2
              done
              echo "Aguardando o RabbitMQ (5672)..."
              until nc -z -w 2 rabbitmq-service 5672; do
                sleep 2
              done
              echo "Aguardando o Redis (6379)..."
              until nc -z -w 2 redis-service 6379; do
                sleep 2
              done
              echo "Todas as dependências estão prontas!"
      containers:
        - name: catalog-api
          image: 230287251097.dkr.ecr.sa-east-1.amazonaws.com/fgc-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: connection-string } }
            - name: Jwt__Issuer
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: jwt-issuer } }
            - name: Jwt__Audience
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: jwt-audience } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: jwt-key } }
            - name: Jwt__TokenTtlInMinutes
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: jwt-token-ttl } }
            - name: RabbitMQ__URI
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: rabbitmq-uri } }
            - name: RabbitMQ__OrderCreatedEvent__Exchange
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: order-created-exchange } }
            - name: RabbitMQ__OrderCreatedEvent__RoutingKey
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: order-created-routing-key } }
            - name: RabbitMQ__OrderCreatedEvent__QueueName
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: order-created-queue-name } }
            - name: RabbitMQ__PaymentProcessedEvent__Exchange
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: payment-processed-exchange } }
            - name: RabbitMQ__PaymentProcessedEvent__RoutingKey
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: payment-processed-routing-key } }
            - name: RabbitMQ__PaymentProcessedEvent__QueueName
              valueFrom: { configMapKeyRef: { name: catalog-api-config, key: payment-processed-queue-name } }
            - name: Redis__ConnectionString
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: redis-connection } }
            - name: MongoDB__ConnectionString
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: mongodb-uri } }
            - name: MongoDB__DatabaseName
              valueFrom: { secretKeyRef: { name: catalog-api-secrets, key: mongodb-dbname } }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api-service
  namespace: fgc
spec:
  type: ClusterIP
  selector: { app: catalog-api }
  ports: [{ port: 80, targetPort: 8080 }]
